<html lang="ko">

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>

body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard Variable",Pretendard,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;line-height:1.65;font-size:16px;color:#22262B;word-break:keep-all}
a{color:var(--pt)}
svg{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wrap{max-width:860px;margin:0 auto;padding:0 18px}
header{background:var(--deep);color:#fff;padding:24px 0 28px;border-bottom:3px solid var(--brass)}
header .top strong{letter-spacing:.2px}header .top strong::before{content:'';display:inline-block;width:18px;height:2px;background:var(--brass);vertical-align:middle;margin-right:8px}header .top{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:14px}

.sb{display:flex;align-items:center;gap:10px;background:#fff;border-radius:12px;padding:0 14px;color:var(--sub);font-size:20px}
#q{flex:1;padding:13px 0;border:0;outline:0;font-size:16px;font-family:inherit;background:transparent;min-width:0}
main{padding:20px 0 40px}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:22px}
.quick a{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 6px 12px;text-align:center;text-decoration:none;color:var(--ink);font-size:13.5px;font-weight:600;line-height:1.35}
.quick .ic{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;margin:0 auto 8px;background:var(--ink);color:#C2A56E}

.sec{font-size:13px;font-weight:700;color:var(--sub);letter-spacing:.5px;margin:0 2px 10px}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.cat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 16px 8px}

.keys{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:14px 0}
.key{background:var(--bg);border-radius:14px;padding:14px 14px 12px}

.key span{font-size:13px;color:var(--sub);line-height:1.4;display:block;margin-top:4px}
.steps{list-style:none;margin:12px 0;padding:0;counter-reset:s}

.steps li::before{content:counter(s);position:absolute;left:0;top:0;width:30px;height:30px;border-radius:50%;background:var(--ink);color:#fff;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center}
.steps li::after{content:"";position:absolute;left:14px;top:32px;bottom:2px;width:2px;background:var(--line)}
.steps li:last-child{padding-bottom:2px}.steps li:last-child::after{display:none}
.steps b{display:block;font-size:16px}
.steps span{color:var(--sub);font-size:14.5px}
.chk,.xs{list-style:none;margin:10px 0;padding:0}

.chk svg,.xs svg{font-size:20px;margin-top:2px;color:var(--grn)}
.xs svg{color:var(--red)}

.box dl{margin:0}.box dt{font-size:12.5px;color:var(--sub);margin-top:9px}.box dd{margin:0;font-size:15px;font-weight:600}
.rows{border:1px solid var(--line);border-radius:14px;overflow:hidden;margin:12px 0}
.row{display:flex;gap:12px;align-items:center;padding:11px 14px;border-top:1px solid var(--line);font-size:15px}
.row:first-child{border-top:0}.row.one b{width:auto!important;flex:1}.row.one span{display:none}
.row b{flex:none;width:118px;font-size:14.5px}
.row span{flex:1;color:#2c3a52}
.row em{flex:none;font-style:normal;font-weight:700;color:var(--ink);font-size:14.5px}
.note,.tip{display:flex;gap:10px;border-radius:12px;padding:12px 14px;font-size:14.5px;margin:14px 0;line-height:1.55}
.note{background:var(--warnbg);color:var(--warn)}.tip{background:var(--ptbg);color:var(--pt)}
.note svg,.tip svg{font-size:20px;margin-top:1px}
details{border:1px solid var(--line);border-radius:14px;margin:8px 0;background:#fff;overflow:hidden}
summary{cursor:pointer;padding:13px 14px;font-weight:700;display:flex;align-items:center;gap:10px;list-style:none}
summary::-webkit-details-marker{display:none}
summary .nm{flex:1}
summary::after{content:"";width:8px;height:8px;border-right:2px solid #9aa3b2;border-bottom:2px solid #9aa3b2;transform:rotate(45deg);margin:0 4px 4px 0;transition:transform .15s}

details[open] summary{border-bottom:1px solid var(--line);background:#fafbfc}

.qm{width:26px;height:26px;border-radius:8px;background:var(--bluebg);color:var(--blue);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;flex:none}

.shot .frm{display:flex;flex-wrap:wrap;align-items:center;gap:6px;color:var(--sub)}

.shot .frm s{text-decoration:none;border-radius:6px;padding:3px 10px;background:#4a5261;color:#fff;font-weight:600}
.shot .frm s.on,.shot .act s{background:var(--ink);color:#fff;box-shadow:0 0 0 2px #fff,0 0 0 4px var(--brass)}

.shot .act{display:flex;justify-content:flex-end;align-items:center;gap:8px;color:var(--pt);font-weight:600}
.shot .act s{text-decoration:none;border-radius:6px;padding:4px 12px;font-weight:700}
.cap{font-size:12px;color:#9aa1ad;margin:4px 2px 0}
.flow{display:flex;flex-wrap:wrap;align-items:stretch;gap:6px;margin:12px 0}
.flow div{flex:1 1 120px;background:var(--bg);border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.45;position:relative}
.flow div b{display:block;font-size:15px;color:var(--ink)}
.flow div span{color:var(--sub);font-size:13px}
.flow div i{font-style:normal;display:inline-block;font-size:11.5px;font-weight:700;color:var(--pt);background:var(--ptbg);border-radius:20px;padding:0 8px;margin-bottom:4px}
.btns{margin-top:18px;display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-flex;align-items:center;gap:6px;background:var(--ink);color:#fff;text-decoration:none;padding:11px 16px;border-radius:12px;font-size:15px;font-weight:600}
.btn.g{background:#fff;color:var(--ink);border:1px solid var(--line)}
.soon{text-align:center;padding:26px 10px;color:var(--sub)}
.soon .ic{font-size:40px;color:#b5bcc9}
footer{border-top:1px solid var(--line);padding:22px 0 40px;color:var(--sub);font-size:13.5px}
.empty{color:var(--sub);padding:20px 4px}
@media(max-width:560px){header h1{font-size:22px}article{padding:18px 15px 22px}article h2{font-size:21px}.quick{gap:8px}.quick a{font-size:12.5px}.row{flex-wrap:wrap;gap:2px 12px}.row b{width:100%}}
</style>
</head>
<body>
<header><div class="wrap">

const ic=n=>`<svg viewBox="0 0 24 24" aria-hidden="true">${I[n]}</svg>`;
const steps=a=>`<ol class="steps">${a.map(s=>Array.isArray(s)?`<li><b>${s[0]}</b><span>${s[1]}</span></li>`:`<li><b style="font-weight:500">${s}</b></li>`).join('')}</ol>`;

const shot=c=>{const P=c[6],ap=c[2];return `<div class="shot" aria-hidden="true"><div class="bar"><i></i><i></i><i></i><span>${c[1]}</span></div><div class="bd2">

const SOON=t=>`<div class="soon"><div class="ic">${ic('clock')}</div><p><b>준비 중인 글입니다</b><br>들어갈 내용: ${t}</p></div>`;

  });
  const quick=k?'':`<p class="sec">많이 찾는 안내</p><div class="quick">${QUICK.map(x=>`<a href="#/${x[0]}"><div class="ic">${ic(x[1])}</div>${x[2]}</a>`).join('')}</div><p class="sec">전체 안내</p>`;
  V.innerHTML=out?quick+`<div class="cats">${out}</div>`:`<p class="empty">‘${Q.value.replace(/[<>&]/g,'')}’에 맞는 글이 없습니다. 카카오톡 채널로 물어봐 주세요.</p>`;
}
function show(){
  const id=location.hash.replace(/^#\/?/,'');let hit=null;
  DATA.forEach(c=>c.a.forEach(a=>{if(a.id===id)hit=[c,a];}));
  if(!hit){home();return;}
  V.innerHTML=`<a class="back" href="#/">${ic('back')}안내서 처음으로</a><article><span class="crumb">${hit[0].t}</span><h2>${hit[1].t}</h2>${hit[1].meta?`<div class="meta">${hit[1].meta}</div>`:''}${hit[1].h}</article>`;
  window.scrollTo(0,0);
}
Q.addEventListener('input',()=>{if(location.hash.length>2)history.replaceState(null,'','#/');home();});
window.addEventListener('hashchange',show);show();
</script>
</body>
</html>
